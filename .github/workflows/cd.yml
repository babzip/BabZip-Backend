name: Deploy to EC2

on:
  push:
    branches:
      - dev  # 또는 main 등 원하는 브랜치

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          echo "$EC2_KEY" > key.pem
          chmod 600 key.pem
        env:
          EC2_KEY: ${{ secrets.EC2_KEY }}

      - name: Deploy to EC2
        run: |
          ssh -o StrictHostKeyChecking=no -i key.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            cd ~/BabZip-Backend
            git pull origin dev
            ./gradlew clean build
            pkill -f 'babzip-0.0.1-SNAPSHOT.jar' || true
            nohup java -jar build/libs/babzip-0.0.1-SNAPSHOT.jar --spring.profiles.active=${{ secrets.SPRING_PROFILE }} &
          EOF