server:
  port: 443
  ssl:
    enabled: true
    key-store: file:/home/ubuntu/keystore.p12
    key-store-password: ${SSL_SECRET}
    key-store-type: PKCS12

jwt:
  secret-key: ${JWT_SECRET_KEY}
  access-token-expire-in: 1800
  refresh-token-expire-in: 1209600

spring:
  datasource:
    url: jdbc:mysql://localhost:3307/babzipdb?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: babzip
    password: babzippass
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: 540803440273-6dtj5tfo86g1vj3vll8jvp6q450nvttr.apps.googleusercontent.com
            client-secret: ${GOOGLE_SECRET}
            redirect-uri: ${BASE_URI}/login/oauth2/code/google
            scope: # google API의 범위 값
              - profile
              - email
          kakao:
            client-id: 8f17ac3d01994250b691c46ef491b316
            client-secret: ${KAKAO_SECRET}
            client-name: Kakao
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            redirect-uri: ${BASE_URI}/login/oauth2/code/kakao
            scope:
              - account_email
              - profile_nickname
              - profile_image

        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub

          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id


